name: pin-lint

on:
    pull_request:
        paths: ['.github/workflows/**', 'scripts/ci/**']

permissions:
    contents: read

jobs:
    sha-pinning:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - run: bash scripts/ci/check-sha-pinning.sh
