group-lists:
  get:
    tags:
      - Group lists
    summary: Get all Group lists
    responses:
      '200':
        description: Returns a list of Group lists
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupListsCollection"
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - Group lists
    summary: Create a Group list instance
    description: | 
      Para llenar estos parametros, usa los IDs correspondientes a registros existentes en el sistema: 
      - lista_grupos -> conjunto de IDs de grupos (Groups)
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateGroupList"
    responses:
      '201':
        description: Group list instance created succesfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
group-lists_id:
  get:
    tags:
      - Group lists
    summary:  Fetch a Group list by ID
    parameters: 
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        descripcion: Return a Group list instance
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: "#/components/schemas/message"
                data:
                  $ref: "#/components/schemas/GroupList"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - Group lists
    summary: Update a Group list instance
    description: | 
      Para llenar estos parametros, usa los IDs correspondientes a registros existentes en el sistema: 
      - lista_grupos -> conjunto de IDs de grupos (Groups)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateGroupList"
    responses:
      '200':
        description: Group list updated succesfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
group-lists_delete:
  get:
    tags:
      - Group lists
    summary: Delete a Group list instance
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Group list instance deleted succesfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
group-lists_search:
  post:
    tags:
      - Group lists
    summary: Search Group lists instances by a specific field and value
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: Returns a list of GroupLists which match with the search
        content:
          application/json:
            schema:
              $ref:  "#/components/schemas/GroupListsCollection"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'        
components:
  schemas:
    message:
      type: string
      example: Success
    descripcion:
      type: string
      example: this is a description
    is_active:
      oneOf:
        - type: boolean
        - type: number
          enum: [0,1]
    lista_grupos:
      type: array
      items:
        type: object
        properties:
          id:
              $ref: "../common/fields.yaml#/schemas/id"
    updated_by:
      type: string
      format: uuid
    created_by:
      type: string
      format: uuid
    Created:
      type: object
      properties:
        created_at:
          $ref: "../common/fields.yaml#/schemas/created_at"
        created_by:
          $ref: "../common/fields.yaml#/schemas/created_by"
    Updated:
      type: object
      properties:
        updated_at:
          $ref: "../common/fields.yaml#/schemas/updated_at"
        updated_by:
          $ref: "../common/fields.yaml#/schemas/updated_by"
    Deleted:
      type: object
      properties:
        deleted_at:
          $ref: "../common/fields.yaml#/schemas/deleted_at"
        deleted_by:
          $ref: "../common/fields.yaml#/schemas/deleted_by"
    GroupListBase:
      type: object
      properties:
        descripcion:
          $ref: "#/components/schemas/descripcion"
        is_active:
          $ref: "#/components/schemas/is_active"
        lista_grupos:
          $ref: "#/components/schemas/lista_grupos"
    GroupList:
      allOf:
        - type: object  
          properties:
            id:
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/GroupListBase"
        - $ref: "#/components/schemas/Created"
        - $ref: "#/components/schemas/Updated"
        - $ref: "#/components/schemas/Deleted"
    GroupListsCollection:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/message"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/GroupList"
        metadata:
          type: object
    CreateGroupList:
        allOf:
          - type: object  
            properties:
              id:
                $ref: "../common/fields.yaml#/schemas/id"
          - $ref: "#/components/schemas/GroupListBase"
          - type: object
            properties:
              created_at:
                $ref: "../common/fields.yaml#/schemas/created_at"
              created_by:
                $ref: "#/components/schemas/created_by"
    UpdateGroupList:
        allOf:
        - $ref: "#/components/schemas/GroupListBase"
        - type: object
          properties:
            updated_at:
              $ref: "../common/fields.yaml#/schemas/updated_at"
            updated_by:
              $ref: "#/components/schemas/updated_by"
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: descripcion
              operator:
                type: string
                example: like
              value:
                type: string
                example: example descripcion
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0