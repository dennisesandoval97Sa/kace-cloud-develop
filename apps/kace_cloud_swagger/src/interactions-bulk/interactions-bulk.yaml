interactions_bulk_move:
    post:
        tags:
            - Interactions Bulk
        summary: Bulk move interactions to another workspace
        description: |
            Requires permission InteractionsBulkMove (administrator role, interactions resource).

            For each field, use IDs of existing records:
            - interaction_ids -> interaction IDs, between 1 and 500 items
            - workspace_id -> destination workspace ID
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BulkInteractionsMoveRequest'
        responses:
            '200':
                description: Interactions moved successfully
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BulkInteractionsUpdatedResponse'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '403':
                description: Forbidden to move interactions
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

interactions_bulk_close:
    post:
        tags:
            - Interactions Bulk
        summary: Bulk close interactions
        description: |
            Requires permission InteractionsBulkClose (administrator role, interactions resource).

            For each field, use IDs of existing records:
            - interaction_ids -> interaction IDs, between 1 and 500 items
            - motive -> active literal option under interactions -> closed_observation
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BulkInteractionsMotiveRequest'
        responses:
            '200':
                description: Interactions closed successfully
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BulkInteractionsUpdatedResponse'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '403':
                description: Forbidden to close interactions
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

interactions_bulk_delete:
    post:
        tags:
            - Interactions Bulk
        summary: Bulk delete interactions
        description: |
            Requires permission InteractionsDelete (administrator role, interactions resource).

            For each field, use IDs of existing records:
            - interaction_ids -> interaction IDs, between 1 and 500 items
            - motive -> active literal option under interactions -> closed_observation
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BulkInteractionsMotiveRequest'
        responses:
            '200':
                description: Interactions deleted successfully
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BulkInteractionsUpdatedResponse'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '403':
                description: Forbidden to delete interactions
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
    schemas:
        BulkInteractionsMoveRequest:
            type: object
            required:
                - interaction_ids
                - workspace_id
            properties:
                interaction_ids:
                    type: array
                    minItems: 1
                    maxItems: 500
                    items:
                        type: string
                        format: uuid
                workspace_id:
                    type: string
                    format: uuid

        BulkInteractionsMotiveRequest:
            type: object
            required:
                - interaction_ids
                - motive
            properties:
                interaction_ids:
                    type: array
                    minItems: 1
                    maxItems: 500
                    items:
                        type: string
                        format: uuid
                motive:
                    type: string
                    minLength: 1

        BulkInteractionsUpdatedResponse:
            type: object
            properties:
                message:
                    type: string
                    example: Success
                data:
                    type: object
                    properties:
                        updated:
                            type: integer
