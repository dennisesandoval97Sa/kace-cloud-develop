wsRestFunctions:
  get:
    tags:
      - WS rest functions
    summary: Get all WSRestFunctions instances
    responses:
      '200':
        description: A list of WSRestFunctions
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WSRestFunctionsCollection"
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

  post: 
    tags: 
      - WS rest functions
    summary: Create a new WSRestFunctions instance
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Created"
    responses:
      '201':
        description: WSRestFunctions created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

wsRestFunction_id:
  get:
    tags:
      - WS rest functions
    summary: Fetch a WSRestFunctions instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: WSRestFunctions instance fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WSRestFunctionsResponse"
              
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

  post: 
    tags: 
      - WS rest functions
    summary: Update WSRestFunctions instance 
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Updated"
    responses:
      '200':
        description: WSRestFunctions instance updated successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

wsRestFunction_delete:
  get:
    tags:
      - WS rest functions
    summary: Delete WSRestFunctions instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: WSRestFunctions deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

wsRestFunctions_search:
  post:
    tags:
      - WS rest functions
    summary: Search WSRestFunctions by a specific field and value
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: WSRestFunctions instances fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WSRestFunctionsCollection"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
  schemas:
    WSRestFunctionsBase:
      type: object
      properties:
        type:
          type: string
          enum: [formatDate, dateDifference, toUpperCase, toLowerCase, trim, concatenate, maskText, isValidUUID, increment, encrypt, hash, formatNumber, formatText, validatePhone, validateEmail]
          example: "toUpperCase"
        filter_input:
          type: object
          properties:
            filter_input:
              type: array
              items:
                type: string
        context_position:
          type: string
          example: "context.position_value_1"
        description:
          type: string
          example: "Nombre de la función"
        value_static:
          type: string
          example: "texto de prueba"
        value_dynamic:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true

    WSRestFunctions:
      allOf:
        - type: object
          properties:
            id:  
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/WSRestFunctionsBase"
        - $ref: "#/components/schemas/Created"
        - $ref: "#/components/schemas/Updated"
    
    WSRestFunctionsCollection:
      type: object
      properties:
        message:
            $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/WSRestFunctions"
        metadata:
          type: object
          properties:
            count:
              type: string
              example: '198'

    WSRestFunctionsResponse:
      type: object
      properties:
        message:
            $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
            $ref: "#/components/schemas/WSRestFunctions"
        metadata:
          type: object
          properties:
            count:
              type: string
              example: '198'

    Created:
      allOf:
        - type: object  
          properties:
            id:
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/WSRestFunctionsBase"
        - type: object
          properties:
            created_at:
              $ref: "../common/fields.yaml#/schemas/created_at"
            created_by:
              $ref: "../common/fields.yaml#/schemas/created_by"
    
    Updated:
      allOf:
        - $ref: "#/components/schemas/WSRestFunctionsBase"
        - type: object
          properties:
            updated_at:
              $ref: "../common/fields.yaml#/schemas/updated_at"
            updated_by:
              $ref: "../common/fields.yaml#/schemas/updated_by"
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: description
              operator:
                type: string
                example: like
              value:
                type: string
                example: description example
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0
