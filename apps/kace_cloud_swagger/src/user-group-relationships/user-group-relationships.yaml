user-group-relationships:
  get:
    tags:
      - User group relationships
    summary: Get user-group-relationships collection
    operationId: getUser-group-relationships
    responses:
      '200':
        description: A list of user-group-relationships
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collection'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - User group relationships
    summary: create a batch to users and groups relationships
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - usuario_id -> ID de un usuario (Users)
      - grupo_id -> ID de un grupo (Groups)
    requestBody:
      description: Must be an array whit users and groups id's per each item
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/collection-item'
  
    responses:
      '200':
        description: batch user-group-relationships instance created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
user-group-relationships_delete:
  get:
    tags:
      - User group relationships
    summary: Delete an user-group-relationships instance by boot ID's
    parameters:
      - name: userId
        in: path
        required: true
        description: an existing user id
      - name: groupId
        in: path
        required: true
        description: an existing group id   
    responses:
      '200':
        description: user-group-relationships instance deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

