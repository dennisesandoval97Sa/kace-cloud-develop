user-group-relationships_search:
  post:
    tags:
      - User group relationships
    summary: Get user-group-relationships whit advanced filters
    requestBody:
      description: In this JSON body use only the properties that you need search
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: A list of user-group-relationships
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collection'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
  schemas:
    collection-item:
      type: object
      properties:
        usuario_id:
          $ref: '../common/fields.yaml#/schemas/id'
        grupo_id:
          $ref: '../common/fields.yaml#/schemas/id'

    collection:
      type: object
      properties:
        message:
          $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/collection-item'
        metadata:
          type: object
          properties:
            count:
              type: string
              example: '198'
    createBodyRequest_user:
      type: object
      properties:
        usuario_id:
          $ref: '../common/fields.yaml#/schemas/id'
    createBodyRequest_group:
      type: object
      properties:
        grupo_id:
          $ref: '../common/fields.yaml#/schemas/id'
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: usuario_id
              operator:
                type: string
                example: like
              value:
                type: string
                format: uuid
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0