
classifications-groups-relationships-batch:
  post:
    tags:
      - Classification group relationships batch
    summary: Create a batch of classification-group-relationships
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - classification_id -> ID de una clasificacion (Classifications)
      - group_id -> ID de un grupo (Groups)
      - form -> ID de un one script (One Script)
    requestBody:
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ClassificationGroupRelationships"
    responses:
      '201':
        description: Batch of classification-group-relationship created succesfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
  schemas:
    classification_id:
      type: string
      format: uuid
    group_id:
      type: string
      format: uuid
    form:
      type: string
      format: uuid
    ClassificationGroupRelationships:
      type: object
      properties:
        classification_id:
          $ref: "#/components/schemas/classification_id"
        group_id:
          $ref: "#/components/schemas/group_id"
        form:
          $ref: "#/components/schemas/form"