cases_calculate-ans:
  get:
    tags:
      - Cases Calculate Ans
    summary: Calculate ans for a specific case
    description: | 
      Para llenar estos parametros, usa los IDs correspondientes a registros existentes en el sistema: 
      - id -> ID de un caso (Cases)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Case reopened successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnsCalcule"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
  schemas:
    AnsCalcule:
      type: object
      properties:
        position:
          type: number
          example: 2
        elapsedTime:
          type: object
          properties:
            days: 
              type: number
            hours:
              type: number
            minutes:
              type: number
        description:
          type: string