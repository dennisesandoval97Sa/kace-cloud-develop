Agenda:
    get:
        tags:
            - Agenda
        summary: Get all agenda instances
        responses:
            '200':
                description: A list of agendas
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgendasCollection'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

    post:
        tags:
            - Agenda
        summary: Create a new agenda instance
        description: |
            Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
            - one_script_id -> ID de un one script (One Script)
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgendaCreate'
        responses:
            '201':
                description: Agenda created successfully
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgendaCreatedResponse'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

Agenda_id:
    get:
        tags:
            - Agenda
        summary: Fetch an agenda instance by ID
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
        responses:
            '200':
                description: Agenda instance fetched successfully
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                data:
                                    $ref: '#/components/schemas/Agenda'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

    post:
        tags:
            - Agenda
        summary: Update agenda instance
        description: |
            Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
            - one_script_id -> ID de un one script (One Script)
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
        requestBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/AgendaUpdate'
        responses:
            '200':
                description: Agenda updated successfully
                content:
                    application/json:
                        schema:
                            $ref: '../common/fields.yaml#/schemas/success_response'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

Agenda_delete:
    get:
        tags:
            - Agenda
        summary: Delete agenda instance by ID
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
        responses:
            '200':
                description: Agenda deleted successfully
                content:
                    application/json:
                        schema:
                            $ref: '../common/fields.yaml#/schemas/success_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

Agenda_search:
    post:
        tags:
            - Agenda
        summary: Search agenda instances by a specific field and value
        requestBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchCollection'
        responses:
            '200':
                description: Agenda instances fetched successfully
                content:
                    application/json:
                        schema:
                            data:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Agenda'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
    schemas:
        AgendaBase:
            type: object
            properties:
                description:
                    type: string
                    example: description example
                one_script_id:
                    type: string
                    format: uuid
                daily_limit:
                    type: number
                    example: 3
                is_active:
                    type: boolean
                    example: true
                is_for_weekend:
                    type: boolean
                    example: true
        Agenda:
            allOf:
                - type: object
                  properties:
                      id:
                          $ref: '../common/fields.yaml#/schemas/id'
                - $ref: '#/components/schemas/AgendaBase'
                - type: object
                  properties:
                      created_at:
                          type: string
                          format: date-time
                      created_by:
                          type: string
                          format: uuid
                      updated_at:
                          type: string
                          format: date-time
                      updated_by:
                          type: string
                          format: uuid
        AgendaCreatedResponse:
            type: object
            properties:
                message:
                    type: string
                    example: Resource(s) created
                data:
                    type: object
                    properties:
                        id:
                            $ref: '../common/fields.yaml#/schemas/id'
                metadata:
                    type: object
        SearchCollection:
            type: object
            properties:
                filter:
                    type: array
                    items:
                        type: object
                        properties:
                            field:
                                type: string
                                example: description
                            operator:
                                type: string
                                example: like
                            value:
                                type: string
                                example: description example
                            type:
                                type: string
                                example: AND
                relationship:
                    type: array
                    items:
                limit:
                    type: integer
                    example: 10
                offset:
                    type: integer
                    example: 0
        AgendasCollection:
            type: object
            properties:
                message:
                    $ref: '../common/fields.yaml#/schemas/message_ok'
                data:
                    type: object
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/Agenda'
                metadata:
                    type: object
                    properties:
                        count:
                            type: string
                            example: '0'
        AgendaCreate:
            allOf:
                - type: object
                  properties:
                      id:
                          $ref: '../common/fields.yaml#/schemas/id'
                - $ref: '#/components/schemas/AgendaBase'

        AgendaUpdate:
            allOf:
                - $ref: '#/components/schemas/AgendaBase'
