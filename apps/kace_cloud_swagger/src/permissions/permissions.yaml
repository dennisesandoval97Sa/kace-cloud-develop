permissions:
  get:
    tags:
      - Permissions
    summary: Fetch an Permissions instance by table name
    description: Get detail of one single user-notification of database
    responses:
      "200":
        description: Permissions instance fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: "../common/fields.yaml#/schemas/message_ok"
                data:
                  $ref: "#/components/schemas/List"
                metadata:
                  type: object
      "400":
        $ref: "../common/fields.yaml#/schemas/bad_status_response"
      "404":
        $ref: "../common/fields.yaml#/schemas/not_found_response"
      "500":
        $ref: "../common/fields.yaml#/schemas/custom_error_response"
components:
  schemas:
    column_name:
      type: string
      example: "id"
    data_type:
      type: string
      example: "String"
    character_maximum_length:
      type: number
      example: 36
    relation:
      type: string
      example: "null"
    label:
      type: string
      example: "ID"
    ListBase:
      type: object
      properties:
        agente:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "CasesCreate"
              description:
                type: string
                example: "Crear caso"
              granted:
                type: boolean
                example: false
              module_id:
                type: string
                example: "cases"
        administrador:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "ActionCreate"
              description:
                type: string
                example: "Crear accion"
              granted:
                type: boolean
                example: false
              module_id:
                type: string
                example: "actions"
        auxiliaries:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "ClientsUpdate"
              description:
                type: string
                example: "Actualizar cliente"
              granted:
                type: boolean
                example: true
              module_id:
                type: string
                example: "clients"

    List:
      allOf:
        - type: object
          properties:
            id:
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/ListBase"
