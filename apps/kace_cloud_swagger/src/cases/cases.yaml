            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
cases_id:
    get:
        tags:
            - Cases
        summary: Get a case instance by ID
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
        responses:
            '200':
                description: Case instance fetched successfully
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                message:
                                    $ref: '#/components/schemas/message'
                                data:
                                    $ref: '#/components/schemas/Cases'
                                metadata:
                                    type: object
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
    post:
        tags:
            - Cases
        summary: Update a case instance by ID
        description: |
            Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
            - cliente_id  -> ID de un cliente (Clients)
            - transicion_id -> ID de una transicion (transitions)
            - responsable_id -> ID de un usuario (Users) (este usuario debe pertenecer al grupo referenciado anteriormente)
            - clasificacion_id -> ID de una clasificacion (Classifications)
            - descripcion_caso_id -> ID de una descripcion de caso (Case descriptions)
            - grupo_id -> ID de un grupo (Groups)
            - parent_id -> ID de otro caso (Cases) que actúa como caso padre (opcional)
        parameters:
            - name: id
              in: path
              required: true
              schema:
                  type: string
        requestBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateCase'
        responses:
            '200':
                description: Case instance updated successfully
                content:
                    application/json:
                        schema:
                            $ref: '../common/fields.yaml#/schemas/success_response'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

cases_search:
    post:
        tags:
            - Cases
        summary: Get cases by specifics filters
        requestBody:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchCollection'
        responses:
            '200':
                description: Returns a list of cases which match with the search
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CasesCollection'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

cases_advance_search:
    post:
        tags:
            - Cases
        summary: Advanced search for cases using dynamic filters, relationships, and grouping
        description: >
            This endpoint allows performing advanced searches over cases using filters, relationships,
            grouping, distinct selection, and HAVING clauses.  
            It provides flexibility to query cases based on multiple dynamic criteria.
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchCollection'
                    examples:
                        all_new_props:
                            summary: All new properties (select, group_by, having, relationship, etc.)
                            value:
                                select: ['cases.antiguedad', 'cases.expired_at', 'cases.reference']
                                group_by: ['cases.expired_at']
                                having:
                                    - column: 'cases.expired_at'
                                      operator: 'notNull'
                                      value: null
                                relationship:
                                    - table: 'usuarios'
                                      condition:
                                          column: 'usuarios.id'
                                          refColumn: 'cases.responsable_id'
                                      type: 'left'
                                limit: 100
                                offset: 0
                                filter:
                                    - field: 'cases.fecha_resolucion'
                                      operator: 'null'
                                      value: 'null'
                                      type: 'AND'

                        user_closed_cases:
                            summary: Cases closed by users (select + distinct + relationship)
                            value:
                                select: ['usuarios.nombres', 'cases.reference']
                                distinct: true
                                relationship:
                                    - table: 'usuarios'
                                      condition:
                                          column: 'usuarios.id'
                                          refColumn: 'cases.responsable_id'
                                      type: 'left'
                                limit: 100
                                offset: 0
                                filter:
                                    - field: 'cases.fecha_resolucion'
                                      operator: 'notNull'
                                      value: 'null'
                                      type: 'AND'

                        only_select:
                            summary: Query with only SELECT and filters
                            value:
                                select: ['cases.antiguedad', 'cases.expired_at']
                                limit: 100
                                offset: 0
                                filter:
                                    - field: 'cases.fecha_resolucion'
                                      operator: 'null'
                                      value: 'null'
                                      type: 'AND'

                        without_select:
                            summary: Query without SELECT (default columns)
                            value:
                                distinct: true
                                relationship:
                                    - table: 'usuarios'
                                      condition:
                                          column: 'usuarios.id'
                                          refColumn: 'cases.responsable_id'
                                      type: 'left'
                                limit: 100
                                offset: 0
                                filter:
                                    - field: 'cases.fecha_resolucion'
                                      operator: 'null'
                                      value: 'null'
                                      type: 'AND'
        responses:
            '200':
                description: Returns a list of cases matching the advanced search criteria
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CasesCollection'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

