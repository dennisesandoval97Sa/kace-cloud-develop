action_model_update:
  get:
    tags:
      - Action update model
    summary: Get all action model updates
    description: Retrieves all records from the action model updates table
    operationId: getActionModelUpdates
    responses:
      '200':
        description: A list of action model updates
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionModelUpdateCollection'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - Action update model
    summary: Create an action model update
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateActionModelUpdate'
    responses:
      '201':
        description: Action model update instance created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

action_model_update_id:
  get:
    tags:
      - Action update model
    summary: Fetch an action model update by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Action model update fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: "#/components/schemas/message"
                data:
                  $ref: '#/components/schemas/ActionModelUpdate'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - Action update model
    summary: Update an action model update by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateActionModelUpdate'
    responses:
      '200':
        description: Action model update updated successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

action_model_update_delete:
  get:
    tags:
      - Action update model
    summary: Delete an action model update by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Action model update deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

action_model_update_search:
  post:
    tags:
      - Action update model
    summary: Search action model updates by a specific field and value
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: Returns a list of action model updates which match with the search
        content:
          application/json:
            schema:
              $ref:  "#/components/schemas/ActionModelUpdateCollection"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
  schemas:
    message:
      type: string
      example: Success
    ActionModelUpdate:
      type: object
      properties:
        id:
          type: string
          example: "e6db13c5-bf7b-4bba-a746-429e8c7b6a5c"
        description:
          type: string
          example: "Update description"
        aggregate:
          type: string
          example: "Client"
        field:
          type: string
          example: "status"
        type:
          type: string
          example: "boolean"
        value:
          type: string
          example: "true"
        formula:
          type: string
          example: "modelo_a_modelo"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          format: uuid
    ActionModelUpdateCollection:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/message"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ActionModelUpdate"
        metadata:
          type: object
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: description
              operator:
                type: string
                example: like
              value:
                type: string
                example: description example
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0
    CreateActionModelUpdate:
      type: object
      properties:
        id:
          type: string
          example: "e6db13c5-bf7b-4bba-a746-429e8c7b6a5c"
        description:
          type: string
          example: "Description of the update"
        aggregate:
          type: string
          example: "Client"
        field:
          type: string
          example: "price"
        type:
          type: string
          example: "numero"
        value:
          type: string
          example: "20.99"
        formula:
          type: string
          example: null
    UpdateActionModelUpdate:
      type: object
      properties:
        description:
          type: string
          example: "Updated description"
        aggregate:
          type: string
          example: "Client"
        field:
          type: string
          example: "price"
        type:
          type: string
          example: "numero"
        value:
          type: string
          example: "20.99"
        formula:
          type: string
          example: null

