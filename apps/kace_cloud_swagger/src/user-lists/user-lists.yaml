user-lists:
  get:
    tags:
      - User lists
    summary: Get user-lists collection
    operationId: getuser-lists
    responses:
      '200':
        description: A list of user-lists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collection'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - User lists
    summary: Create an user-lists instance
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - lista_usuarios -> conjunto de IDs de usuarios (Users)
    operationId: postUser-lists
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createBodyRequest'
    responses:
      '201':
        description: user-lists instance created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
user-lists_id:
  get:
    tags:
      - User lists
    summary: Fetch an user-lists instance by ID
    description: Get detail of one single user-notification of database
    operationId: getuser-lists_id
    parameters:
      - name: id
        in: path
        required: true
        description: an existing user-lists id
    responses:
      '200':
        description: user-lists instance fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: '../common/fields.yaml#/schemas/message_ok'
                data:
                  $ref: '#/components/schemas/collection-item'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - User lists
    summary: Update an user-lists instance by ID
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - lista_usuarios -> conjunto de IDs de usuarios (Users)
    parameters:
      - name: id
        in: path
        required: true
        description: an existing user-lists id
    requestBody:
      description: In this JSON body use only the properties that will be modified
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateBodyRequest'
    responses:
      '200':
        description: user-lists instance updated successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
user-lists_delete:
  get:
    tags:
      - User lists
    summary: Delete an user-lists instance by ID
    parameters:
      - name: id
        in: path
        required: true
        description: an existing user-listsid
    responses:
      '200':
        description: user-lists instance deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
user-lists_search:
  post:
    tags:
      - User lists
    summary: Get user-lists whit advanced filters
    requestBody:
      description: In this JSON body use only the properties that you need search
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: A list of user-lists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collection'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
components:
  schemas:
    message:
      type: string
      example: Success
    descripcion:
      type: string
      example: Descripción aleatoria
    lista_usuarios:
      type: array
      items:
        type: object
        properties:
          id:
            $ref: '../common/fields.yaml#/schemas/id'
    is_active:
      type: boolean
      example: true

    collection-item:
      type: object
      properties:
        id:
          $ref: '../common/fields.yaml#/schemas/id'
        descripcion:
          $ref: '#/components/schemas/descripcion'
        lista_usuarios:
          $ref: '#/components/schemas/lista_usuarios'
        is_active:
          $ref: '#/components/schemas/is_active'
        created_at:
          $ref: '../common/fields.yaml#/schemas/created_at'
        created_by:
          $ref: '../common/fields.yaml#/schemas/created_by'
        updated_at:
          $ref: '../common/fields.yaml#/schemas/updated_at'
        updated_by:
          $ref: '../common/fields.yaml#/schemas/updated_by'
        deleted_at:
          $ref: '../common/fields.yaml#/schemas/deleted_at'
        deleted_by:
          $ref: '../common/fields.yaml#/schemas/deleted_by'
   
    collection:
      type: object
      properties:
        message:
          $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/collection-item'
        metadata:
          type: object
    createBodyRequest:
      type: object
      properties:
        id:
          $ref: '../common/fields.yaml#/schemas/id'
        descripcion:
          $ref: '#/components/schemas/descripcion'
        lista_usuarios:
          $ref: '#/components/schemas/lista_usuarios'
        is_active:
          $ref: '#/components/schemas/is_active'
    updateBodyRequest:
      type: object
      properties:
        descripcion:
          $ref: '#/components/schemas/descripcion'
        lista_usuarios:
          $ref: '#/components/schemas/lista_usuarios'
        is_active:
          $ref: '#/components/schemas/is_active'
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: descripcion
              operator:
                type: string
                example: like
              value:
                type: string
                example: example name
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer