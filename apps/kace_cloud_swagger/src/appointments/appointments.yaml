Appointments:
  get:
    tags:
      - Appointments
    summary: Get all appointments instances
    responses:
      "200":
        description: A list of appointments
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentsCollection"
      "404":
        $ref: "../common/fields.yaml#/schemas/not_found_response"
      "500":
        $ref: "../common/fields.yaml#/schemas/custom_error_response"

  post:
    tags:
      - Appointments
    summary: Create a new appointments instance
    description: |
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 

      - case_id -> ID de un caso (Casos)
      - agenda_id -> ID de una agenda (Agenda)

      Nota: Para completar los campos start_time y end_time, debes de hacer lo siguiente:
      1. crear un grupo (Groups)
      2. crear una agenda (Agenda)
      2. vincular esa agenda con ese grupo (Agendas groups)
      2. Crear un registro de appointments time slot y en el agenda_id colocar la agenda creada anteriormente (Appointments time slots)
      2. en start_time colocar una fecha apartir de mañana con la hora que colocaste en el start time de appointments time slot

      Ejemplo: 
        - start_time: 2025-02-18T14:00:00.000Z 
        - end_time: 2025-02-18T15:00:00.000Z

      En este caso:
        - las 14:00 y las 15:00 son las horas colocadas en el registro de appointments time slot

    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppointmentsCreate"
    responses:
      "201":
        description: Appointments created successfully
        content:
          application/json:
            schema:
              $ref: "../common/fields.yaml#/schemas/created_response"
      "400":
        $ref: "../common/fields.yaml#/schemas/bad_status_response"
      "404":
        $ref: "../common/fields.yaml#/schemas/not_found_response"
      "500":
        $ref: "../common/fields.yaml#/schemas/custom_error_response"

Appointments_id:
  get:
    tags:
      - Appointments
    summary: Fetch an appointments instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      "200":
        description: Appointments instance fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/Appointments"
      "400":
        $ref: "../common/fields.yaml#/schemas/bad_status_response"
      "404":
        $ref: "../common/fields.yaml#/schemas/not_found_response"
      "500":
        $ref: "../common/fields.yaml#/schemas/custom_error_response"

  post:
    tags:
      - Appointments
    summary: Update appointments instance
    description: |
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 

      - case_id -> ID de un caso (Casos)
      - agenda_id -> ID de una agenda (Agenda)

      Nota: Para completar los campos start_time y end_time, debes de hacer lo siguiente:
      1. crear un grupo (Groups)
      2. crear una agenda (Agenda)
      2. vincular esa agenda con ese grupo (Agendas groups)
      2. Crear un registro de appointments time slot y en el agenda_id colocar la agenda creada anteriormente (Appointments time slots)
      2. en start_time colocar una fecha apartir de mañana con la hora que colocaste en el start time de appointments time slot

      Ejemplo: 
        - start_time: 2025-02-18T14:00:00.000Z 
        - end_time: 2025-02-18T15:00:00.000Z

      En este caso:
        - las 14:00 y las 15:00 son las horas colocadas en el registro de appointments time slot
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppointmentsUpdate"
    responses:
      "200":
        description: Appointments updated successfully
        content:
          application/json:
            schema:
              $ref: "../common/fields.yaml#/schemas/success_response"
      "400":
        $ref: "../common/fields.yaml#/schemas/bad_status_response"
      "404":
        $ref: "../common/fields.yaml#/schemas/not_found_response"
      "500":
        $ref: "../common/fields.yaml#/schemas/custom_error_response"

Appointments_delete:
