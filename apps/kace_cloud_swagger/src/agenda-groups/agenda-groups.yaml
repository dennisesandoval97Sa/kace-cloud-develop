Agenda-groups:
  get:
    tags:
      - Agenda groups
    summary: Get all agenda groups instances
    responses:
      '200':
        description: A list of agenda groups
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaGroupsCollection"
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post: 
    tags: 
      - Agenda groups
    summary: Create a new agenda groups instance
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - group_id -> ID de un one script (Groups)
      - agenda_id -> ID de un one script (Agenda)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgendaGroupsCreate"
    responses:
      '201':
        description: Agenda groups created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

Agenda-groups_id:
  get:
    tags:
      - Agenda groups
    summary: Fetch an agenda groups instance by ID
    description: | 
      Para llenar estos parametros, usa los IDs correspondientes a registros existentes en el sistema: 
      - groupId -> ID de un one script (Groups)
      - agendaId -> ID de un one script (Agenda)
    parameters:
      - name: agendaId
        in: path
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Agenda groups instance fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/AgendaGroups"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

Agenda-groups_delete:
  get:
    tags:
      - Agenda groups
    summary: Delete agenda groups instance by ID
    description: | 
      Para llenar estos parametros, usa los IDs correspondientes a registros existentes en el sistema: 
      - groupId -> ID de un one script (Groups)
      - agendaId -> ID de un one script (Agenda)
    parameters:
      - name: agendaId
        in: path
        required: true
        schema:
          type: string
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Agenda groups deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

Agenda-groups_search:
  post:
    tags:
      - Agenda groups
    summary: Search agenda groups instances by a specific field and value
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: Agenda groups instances fetched successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaGroupsCollection"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'                

