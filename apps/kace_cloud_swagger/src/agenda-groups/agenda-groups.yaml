    summary: Delete agenda groups instances
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - group_id -> ID de un one script (Groups)
      - agenda_id -> ID de un one script (Agenda)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AgendaGroups"
    responses:
      '201':
        description: Agenda groups deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
  schemas:
    AgendaGroupsBase:
      type: object
      properties:
        agenda_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
    AgendaGroups:
      allOf:
        - $ref: "#/components/schemas/AgendaGroupsBase"
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: group_id
              operator:
                type: string
                example: like
              value:
                type: string
                format: uuid
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0
    AgendaGroupsCollection:
      type: object
      properties:
        message:
          $ref: "../common/fields.yaml#/schemas/message_ok"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AgendaGroups"
        metadata:
          type: object
          properties:
            count:
              type: string
              example: '0'
    AgendaGroupsCreate:
      allOf:
        - $ref: "#/components/schemas/AgendaGroupsBase"
