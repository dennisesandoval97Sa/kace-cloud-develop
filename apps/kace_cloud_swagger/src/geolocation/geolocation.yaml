Geolocation:
  get:
    tags:
      - Geolocation
    summary: Get all geolocation instances
    responses:
      '200':
        description: A list of geolocations
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeolocationCollection"
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

  post: 
    tags: 
      - Geolocation
    summary: Create a new geolocation instance
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - user_id -> ID de un usuario (Users)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeolocationCreate"
    responses:
      '201':
        description: Geolocation created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

Geolocation_id:
  get:
    tags:
      - Geolocation
    summary: Fetch an geolocation instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Geolocation instance fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: "#/components/schemas/Geolocation"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

  post: 
    tags: 
      - Geolocation
    summary: Update geolocation instance 
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - user_id -> ID de un usuario (Users)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeolocationUpdate"
    responses:
      '200':
        description: Geolocation updated successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

Geolocation_delete:
  get:
    tags:
      - Geolocation
    summary: Delete geolocation instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Geolocation deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

Geolocation_search:
  post:
    tags:
      - Geolocation
    summary: Search geolocation instances by a specific field and value
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: Geolocation instances fetched successfully
        content:
          application/json:
            schema:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Geolocation"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'                

components:
  schemas:
    GeolocationBase:
      type: object
      properties:
        action_type:
          type: string
          example: geolocation_login_bool
        user_id:
          type: string
          format: uuid
        longitud:
          type: string
          example: "-75.8940478"
        latitud:
          type: string
          example: "8.7386288"
        ip4_address:
          type: string
          example: "0.0.0.0"
        metadata:
          type: object
          example: {}
    Geolocation:
      allOf:
        - type: object
          properties:
            id:
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/GeolocationBase"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            created_by:
              type: string
              format: uuid
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
              format: uuid
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: ip4_address
              operator:
                type: string
                example: like
              value:
                type: string
                example: "0.0.0.0"
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0
    GeolocationCollection:
      type: object
      properties:
        message:
          $ref: "../common/fields.yaml#/schemas/message_ok"
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Geolocation"
        metadata:
          type: object
          properties:
            count:
              type: string
              example: '0'
    GeolocationCreate:
      allOf:
        - type: object
          properties:
            id:
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/GeolocationBase"

    GeolocationUpdate:
      allOf:
        - $ref: "#/components/schemas/GeolocationBase"
