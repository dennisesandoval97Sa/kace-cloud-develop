users:
  get:
    tags:
      - Users
    summary: Get users collection
    description: Get all users of database users schema
    operationId: getUsers
    responses:
      '200':
        description: A list of Users
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersCollection'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

  post:
    tags:
      - Users
    summary: Create an users instance
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - rol_id -> ID de un rol (Roles)
    operationId: postUser
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createBodyReq'
    responses:
      '201':
        description: User instance created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

users_id:
  get:
    tags:
      - Users
    summary: Fetch an user instance by ID
    description: Get all users of database users schema
    operationId: getUsers_id
    parameters:
      - name: id
        in: path
        required: true
        description: an existing user id
    responses:
      '200':
        description: users instance fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: '../common/fields.yaml#/schemas/message_ok'
                data:
                  $ref: '#/components/schemas/User'
                metadata:
                  type: object
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

  post:
    tags:
      - Users
    summary: Update an users instance by ID
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - rol_id -> ID de un rol (Roles)
    parameters:
      - name: id
        in: path
        required: true
        description: an existing user id
    requestBody:
      description: In this JSON body use only the properties that will be modified
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateBodyReq'
    responses:
      '200':
        description: users instance updated successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

users_delete:
  get:
    tags:
      - Users
    summary: Delete an users instance by ID
    parameters:
      - name: id
        in: path
        required: true
        description: an existing user id
    responses:
      '200':
        description: users instance deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

users_search:
  post:
    tags:
      - Users
    summary: Get users whit advanced filters
    operationId: searchUser
    requestBody:
      description: In this JSON body use only the properties that you need search
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: A list of Users
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsersCollection'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
users_session:
  post:
    tags:
      - Users
    summary: Register user session
    requestBody:
      description: In this JSON body use only the properties that you need search
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/sessionLogin"
    responses:
      '200':
        description: Session updated for user :id
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

