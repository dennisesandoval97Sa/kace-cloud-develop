components:
  schemas:
    login:
      type: string
      example: test.login
    nombres:
      type: string
      example: jon
    apellido1:
      type: string
      example: Doe
    apellido2:
      type: string
      example: Lorem
    email:
      type: string
      example: mail@mail.com
    token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
    telefono:
      type: string
      example: 6085103698
    movil:
      type: string
      example: 3782563149
    password:
      type: string
      example: aB12345.12345678
    is_active:
      type: number
      example: 1

    User:
      type: object
      properties:
        id:
          $ref: '../common/fields.yaml#/schemas/id'
        login:
          $ref: '#/components/schemas/login'
        nombres:
          $ref: '#/components/schemas/nombres'
        apellido1:
          $ref: '#/components/schemas/apellido1'
        apellido2:
          $ref: '#/components/schemas/apellido2'
        email:
          $ref: '#/components/schemas/email'
        token:
          $ref: '#/components/schemas/token'
        telefono:
          $ref: '#/components/schemas/telefono'
        movil:
          $ref: '#/components/schemas/movil'
        is_active:
          $ref: '#/components/schemas/password'
        created_at:
          $ref: '../common/fields.yaml#/schemas/created_at'
        created_by:
          $ref: '../common/fields.yaml#/schemas/created_by'
        updated_at:
          $ref: '../common/fields.yaml#/schemas/updated_at'
        updated_by:
          $ref: '../common/fields.yaml#/schemas/updated_by'
        deleted_at:
          $ref: '../common/fields.yaml#/schemas/deleted_at'
        deleted_by:
          $ref: '../common/fields.yaml#/schemas/deleted_by'
   
    UsersCollection:
      type: object
      properties:
        message:
          $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
        metadata:
          type: object
          properties:
            count: 
              type: object
              properties:
                count:
                  type: string
                  example: "1"
    createBodyReq:
      type: object
      properties:
        id:
          $ref: '../common/fields.yaml#/schemas/id'
        login:
          $ref: '#/components/schemas/login'
        nombres:
          $ref: '#/components/schemas/nombres'
        apellido1:
          $ref: '#/components/schemas/apellido1'
        apellido2:
          $ref: '#/components/schemas/apellido2'
        email:
          $ref: '#/components/schemas/email'
        telefono:
          $ref: '#/components/schemas/telefono'
        movil:
          $ref: '#/components/schemas/movil'
        password:
          $ref: '#/components/schemas/password'
        is_active:
          $ref: '#/components/schemas/is_active'
        rol_id:
          type: string
          format: uuid
    updateBodyReq:
      type: object
      properties:
        login:
          $ref: '#/components/schemas/login'
        nombres:
          $ref: '#/components/schemas/nombres'
        apellido1:
          $ref: '#/components/schemas/apellido1'
        apellido2:
          $ref: '#/components/schemas/apellido2'
        email:
          $ref: '#/components/schemas/email'
        telefono:
          $ref: '#/components/schemas/telefono'
        movil:
          $ref: '#/components/schemas/movil'
        password:
          $ref: '#/components/schemas/password'
        is_active:
          $ref: '#/components/schemas/is_active'
        rol_id:
          type: string
          format: uuid

    userLogin: 
      type: object
      properties:
        login:
          $ref: '#/components/schemas/login'
        password:
          $ref: '#/components/schemas/password'
    sessionLogin: 
      type: object
      properties:
        user_id:
          type: string
          description: "Identificador único del usuario"
          example: "c7b496d6-ffcb-4214-a17b-abd2766025fa"
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: nombres
              operator:
                type: string
                example: like
              value:
                type: string
                example: example name
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0