templates:
    get:
        tags:
            - Templates
        summary: Get templates collection
        description: Get all templates of database
        operationId: gettemplates
        responses:
            '200':
                description: A list of templates
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/collection'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
    post:
        tags:
            - Templates
        summary: Create an templates instance
        description: Registers a templates in database
        operationId: posttemplates
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/createBodyRequest'
        responses:
            '201':
                description: templates instance created successfully
                content:
                    application/json:
                        schema:
                            $ref: '../common/fields.yaml#/schemas/created_response'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
templates_id:
    get:
        tags:
            - Templates
        summary: Fetch an templates instance by ID
        description: Get detail of one single user-notification of database
        operationId: gettemplates_id
        parameters:
            - name: id
              in: path
              required: true
              description: an existing templates id
        responses:
            '200':
                description: templates instance fetched successfully
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                message:
                                    $ref: '../common/fields.yaml#/schemas/message_ok'
                                data:
                                    $ref: '#/components/schemas/collection-item'
                                metadata:
                                    type: object
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
    post:
        tags:
            - Templates
        summary: Update an templates instance by ID
        parameters:
            - name: id
              in: path
              required: true
              description: an existing templates id
        requestBody:
            description: In this JSON body use only the properties that will be modified
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/updateBodyRequest'
        responses:
            '200':
                description: templates instance updated successfully
                content:
                    application/json:
                        schema:
                            $ref: '../common/fields.yaml#/schemas/success_response'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
templates_delete:
    get:
        tags:
            - Templates
        summary: Delete an templates instance by ID
        parameters:
            - name: id
              in: path
              required: true
              description: an existing templatesid
        responses:
            '200':
                description: templates instance deleted successfully
                content:
                    application/json:
                        schema:
                            $ref: '../common/fields.yaml#/schemas/success_response'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'
templates_search:
    post:
        tags:
            - Templates
        summary: Get templates whit advanced filters
        requestBody:
            description: In this JSON body use only the properties that you need search
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchCollection'
        responses:
            '200':
                description: A list of templates
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/collection'
            '400':
                $ref: '../common/fields.yaml#/schemas/bad_status_response'
            '404':
                $ref: '../common/fields.yaml#/schemas/not_found_response'
            '500':
                $ref: '../common/fields.yaml#/schemas/custom_error_response'

components:
    schemas:
        descripcion:
            type: string
            example: texto descriptivo de ejemplo
        ruta:
            type: string
            format: url
            example: http://abadasu.qa/peede
        tipo:
            type: integer
            example: 1
        destinatario:
            type: string
            example: nedorde@bu.aq
        copia:
            type: string
            example: gac@diwimda.mq
        copia_oculta:
            type: string
            example: efdamged@ru.ug
        asunto:
            type: string
            example: Asunto de prueba
        cuerpo:
            type: string
            example: Cuerpo de prueba
        incluye_adjuntos:
            type: boolean
            example: false
        enviar_adjuntos_del_caso:
            type: boolean
            example: false

        collection-item:
            type: object
            properties:
                id:
                    $ref: '../common/fields.yaml#/schemas/id'
                descripcion:
                    $ref: '#/components/schemas/descripcion'
                ruta:
                    $ref: '#/components/schemas/ruta'
                tipo:
                    $ref: '#/components/schemas/tipo'
                destinatario:
                    $ref: '#/components/schemas/destinatario'
                copia:
                    $ref: '#/components/schemas/copia'
                copia_oculta:
                    $ref: '#/components/schemas/copia_oculta'
                asunto:
                    $ref: '#/components/schemas/asunto'
                cuerpo:
                    $ref: '#/components/schemas/cuerpo'
                incluye_adjuntos:
                    $ref: '#/components/schemas/incluye_adjuntos'
                enviar_adjuntos_del_caso:
                    $ref: '#/components/schemas/enviar_adjuntos_del_caso'
                status:
                    $ref: '../common/fields.yaml#/schemas/status'
                created_at:
                    $ref: '../common/fields.yaml#/schemas/created_at'
                created_by:
                    $ref: '../common/fields.yaml#/schemas/created_by'
                updated_at:
                    $ref: '../common/fields.yaml#/schemas/updated_at'
                updated_by:
                    $ref: '../common/fields.yaml#/schemas/updated_by'
                deleted_at:
                    $ref: '../common/fields.yaml#/schemas/deleted_at'
                deleted_by:
                    $ref: '../common/fields.yaml#/schemas/deleted_by'

        collection:
            type: object
            properties:
                message:
                    $ref: '../common/fields.yaml#/schemas/message_ok'
                data:
                    type: object
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/collection-item'
                metadata:
                    type: object
                    properties:
                        count:
                            type: array
                            items:
                                type: object
                                properties:
                                    count:
                                        type: string
                                        example: '198'

        createBodyRequest:
            type: object
            properties:
                id:
                    $ref: '../common/fields.yaml#/schemas/id'
                descripcion:
                    $ref: '#/components/schemas/descripcion'
                ruta:
                    $ref: '#/components/schemas/ruta'
                tipo:
                    $ref: '#/components/schemas/tipo'
                destinatario:
                    $ref: '#/components/schemas/destinatario'
                copia:
                    $ref: '#/components/schemas/copia'
                copia_oculta:
                    $ref: '#/components/schemas/copia_oculta'
                asunto:
                    $ref: '#/components/schemas/asunto'
                cuerpo:
                    $ref: '#/components/schemas/cuerpo'
                incluye_adjuntos:
                    $ref: '#/components/schemas/incluye_adjuntos'
                enviar_adjuntos_del_caso:
                    $ref: '#/components/schemas/enviar_adjuntos_del_caso'
                status:
                    $ref: '../common/fields.yaml#/schemas/status'
        updateBodyRequest:
            type: object
            properties:
                descripcion:
                    $ref: '#/components/schemas/descripcion'
                ruta:
                    $ref: '#/components/schemas/ruta'
                tipo:
                    $ref: '#/components/schemas/tipo'
                destinatario:
                    $ref: '#/components/schemas/destinatario'
                copia:
                    $ref: '#/components/schemas/copia'
                copia_oculta:
                    $ref: '#/components/schemas/copia_oculta'
                asunto:
                    $ref: '#/components/schemas/asunto'
                cuerpo:
                    $ref: '#/components/schemas/cuerpo'
                incluye_adjuntos:
                    $ref: '#/components/schemas/incluye_adjuntos'
                enviar_adjuntos_del_caso:
                    $ref: '#/components/schemas/enviar_adjuntos_del_caso'
                status:
                    $ref: '../common/fields.yaml#/schemas/status'
        SearchCollection:
            type: object
            properties:
                filter:
                    type: array
                    items:
                        type: object
                        properties:
                            field:
                                type: string
                                example: descripcion
                            operator:
                                type: string
                                example: like
                            value:
                                type: string
                                example: description example
                            type:
                                type: string
                                example: AND
                relationship:
                    type: array
                    items:
                limit:
                    type: integer
                    example: 10
                offset:
                    type: integer
                    example: 0
