templateAttachments:
  get:
    tags:
      - Template Attachments
    summary: Get all template attachments
    responses:
      "200":
        description: Returns a list of Template attachments
        content:
          application/json:
            schema:
              $ref:  "#/components/schemas/TemplateAttachmentsCollection"
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - Template Attachments
    summary: Create a template attachments instance
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - template_id -> ID de una plantilla (Templates)
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateTemplateAttachment"
    responses:
      '200':
        description: Template attachment instance created successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/created_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

templateAttachment_id:
  get:
    tags:
      - Template Attachments
    summary: Get a template attachment instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Returns a template attachment instance
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateAttachments"
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'
  post:
    tags:
      - Template Attachments
    summary: Upadate a template attachment instance
    description: | 
      Para llenar estos campos, usa los IDs correspondientes a registros existentes en el sistema: 
      - template_id -> ID de una plantilla (Templates)
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateTemplateAttachment"
    responses:
      '200':
        description: Template attachment instance updated successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

templateAttachment_delete:
  get:
    tags:
      - Template Attachments
    summary: Delete template attachment instance by ID
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Template attachment deleted successfully
        content:
          application/json:
            schema:
              $ref: '../common/fields.yaml#/schemas/success_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'

templateAttachment_search:
  post:
    tags:
      - Template Attachments
    summary: Search template attachment by a specific field and value
    requestBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SearchCollection"
    responses:
      '200':
        description: Template attachment instances fetched successfully
        content:
          application/json:
            schema:
              $ref:  "#/components/schemas/TemplateAttachmentsCollection"
      '400':
        $ref: '../common/fields.yaml#/schemas/bad_status_response'
      '404':
        $ref: '../common/fields.yaml#/schemas/not_found_response'
      '500':
        $ref: '../common/fields.yaml#/schemas/custom_error_response'


components:
  schemas:
    template_id:
      type: string
      format: uuid
    path:
      type: string
      example: prueba.txt
    type:
      type: string
      example: image/png
    is_active:
      oneOf:
        - type: boolean
        - type: number
          enum: [1, 0]
    created_by:
      type: string
      format: uuid
    updated_by:
      type: string
      format: uuid
    Created:
      type: object
      properties:
        created_at:
          $ref: "../common/fields.yaml#/schemas/created_at"
        created_by:
          $ref: "../common/fields.yaml#/schemas/created_by"
    Updated:
      type: object
      properties:
        updated_at:
          $ref: "../common/fields.yaml#/schemas/updated_at"
        updated_by:
          $ref: "../common/fields.yaml#/schemas/updated_by"
    TemplateAttachmentsBase:
      type: object
      properties:
        template_id:
          $ref: "#/components/schemas/template_id"
        path:
          $ref: "#/components/schemas/path"
        type:
          $ref: "#/components/schemas/type"
        is_active:
          $ref: "#/components/schemas/is_active"
    TemplateAttachments:
      type: object
      properties:
        message:
          $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
          type: object
          allOf: 
            - type: object
              properties:
                id:
                  $ref: "../common/fields.yaml#/schemas/id"
            - $ref: "#/components/schemas/TemplateAttachmentsBase"
            - $ref: "#/components/schemas/Created"
            - $ref: "#/components/schemas/Updated"
        metadata:
          type: object
    TemplateAttachmentsCollection:
      type: object
      properties:
        message:
          $ref: '../common/fields.yaml#/schemas/message_ok'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TemplateAttachments"
        metadata:
          type: object
          properties:
            count:
              type: array
              items:
                type: object
                properties:
                  count:
                    type: string
                    example: '198'
    CreateTemplateAttachment:
      allOf:
        - type: object
          properties:
            id:
              $ref: "../common/fields.yaml#/schemas/id"
        - $ref: "#/components/schemas/TemplateAttachmentsBase"
        - type: object
          properties:
            created_by:
              $ref: "#/components/schemas/created_by"
            created_at:
              $ref: "../common/fields.yaml#/schemas/created_at"
    UpdateTemplateAttachment:
      allOf:
        - $ref: "#/components/schemas/TemplateAttachmentsBase"
        - type: object
          properties:
            updated_by:
              $ref: "#/components/schemas/updated_by"
            updated_at:
              $ref: "../common/fields.yaml#/schemas/updated_at"
    SearchCollection:
      type: object
      properties:
        filter:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: template_id
              operator:
                type: string
                example: like
              value:
                type: string
                format: uuid
              type:
                type: string
                example: AND
        relationship:
          type: array
          items:
        limit:
          type: integer
          example: 10
        offset:
          type: integer
          example: 0