        aws_css_url:
          type: string
          nullable: true
        aws_css_username:
          type: string
          maxLength: 255
          nullable: true
        aws_css_password:
          type: string
          nullable: true

    TenantUpdateRequest:
      type: object
      description: |
        All fields are optional for updates.

        **Note:** The subdomain cannot be changed after creation as it's the primary key.
        To change a subdomain, you must create a new tenant and migrate data.
      properties:
        subdomain:
          type: string
          maxLength: 255
          nullable: true
          readOnly: true
          description: Subdomain cannot be updated (read-only)
