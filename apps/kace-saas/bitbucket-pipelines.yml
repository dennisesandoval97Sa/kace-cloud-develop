image: node:22 # SONAR-EXC: document-start no requerido aquí

clone:
  depth: full

definitions:
  steps:
    - step: &bump_version
        name: Bump version (patch) on merge
        caches:
          - node
        script:
          - git config user.name "$GIT_USER"
          - git config user.email "$GIT_EMAIL"
          - git remote set-url origin "https://${BB_USERNAME}:${BB_APP_PASSWORD}@bitbucket.org/${BITBUCKET_REPO_FULL_NAME}.git" # SONAR-EXC: Se requiere mantener en una sola línea para compatibilidad
          - npm ci
          - npm version patch -m "chore(release) %s [skip ci]"
          - git push origin HEAD:$BITBUCKET_BRANCH
          - git push origin --follow-tags

pipelines:
  branches:
    develop:
      - step: *bump_version
